# Application Info
spring.application.name=task-manager-api
server.port=8080

# Database (MySQL) Config
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/taskdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Config
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# JWT Configuration (IMPORTANT!)
application.security.jwt.secret-key=uJT5PI/qfMI49+DQBNixeyKjzkneBvU65Ig2BEllZVU=
application.security.jwt.expiration=3600000

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.com.hexaware=DEBUG
logging.level.org.springframework.web=DEBUG
